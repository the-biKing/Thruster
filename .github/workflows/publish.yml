name: Publish to Open VSX

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package VSIX
        id: package
        run: |
          python build_vsix.py
          VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          VSIX="thruster-${VERSION}.vsix"
          echo "vsix_file=${VSIX}" >> $GITHUB_OUTPUT

      - name: Publish to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_PAT || secrets.OPEN_VSX_TOKEN }}
        run: |
          npx ovsx publish "${{ steps.package.outputs.vsix_file }}" -p "$OVSX_TOKEN"

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.vsix_file }}
          tag_name: ${{ github.ref_name }}
          name: Thruster ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
