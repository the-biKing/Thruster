name: Publish to Open VSX

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package VSIX
        run: python build_vsix.py

      - name: Publish to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_PAT || secrets.OPEN_VSX_TOKEN }}
        run: |
          npx ovsx publish thruster-*.vsix -p "$OVSX_TOKEN"

      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: thruster-*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
